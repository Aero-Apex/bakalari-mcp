<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bakaláři MCP - options</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #1c1c1c; }
    h1 { font-size: 20px; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
    small { color: #555; display: block; font-weight: 400; }
    button { margin-top: 18px; padding: 8px 16px; font: inherit; }
    #msg { margin-top: 14px; }
    .ok { color: #1b7a3a; } .bad { color: #b3261e; }
  </style>
</head>
<body>
  <h1>Bakaláři MCP cookie sync</h1>
  <label>Server address
    <input id="server" type="text" placeholder="http://192.0.2.10:8765">
    <small>Where your Bakaláři MCP receiver listens (shown by bakalari-mcp setup).</small>
  </label>
  <label>Token
    <input id="token" type="password" autocomplete="off">
    <small>The secret shown by bakalari-mcp setup (BAKALARI_RECEIVER_TOKEN).</small>
  </label>
  <label>School website
    <input id="school" type="text">
  </label>
  <label><input id="keepAlive" type="checkbox"> Keep the school session alive while the browser is open</label>
  <button id="save">Save</button>
  <div id="msg"></div>
  <script src="options.js"></script>
</body>
</html>
